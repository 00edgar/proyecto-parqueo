<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Parqueo Pro</title>
    <link rel="stylesheet" href="parqueo.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Sistema de Gestión de Parqueo</h1>
        <p>Control diferenciado por tipo de vehículo</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h3>Ocupación</h3><p id="stat-occupancy">0/20</p></div>
        <div class="stat-card"><h3>Tasa Ocupación</h3><p id="stat-rate">0%</p></div>
        <div class="stat-card"><h3>Vehículos Hoy</h3><p id="stat-total">0</p></div>
        <div class="stat-card"><h3>Promedio</h3><p id="stat-avg-time">0 min</p></div>
    </div>

    <div class="main-layout">
        <div class="left-column">
            <div class="card">
                <h2>🚗 Slots para Carros</h2>
                <div class="parking-grid" id="grid-carros"></div>
                
                <h2 style="margin-top: 30px;">🏍️ Slots para Motos</h2>
                <div class="parking-grid" id="grid-motos"></div>
            </div>

            <div class="card" style="margin-top: 20px;" id="panel-ocupados">
                <h2>📋 Lista de Vehículos Ocupados</h2>
                <table class="tabla-ocupados">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Tipo</th>
                            <th>Slot</th>
                            <th>Entrada</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="lista-ocupados-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="right-column">
            <div class="card">
                <h2>Registrar Entrada</h2>
                <div class="form-group">
                    <label>Placa del Vehículo</label>
                    <input type="text" id="input-placa" placeholder="ABC-1234">
                </div>
                <div class="form-group">
                    <label>Tipo de Vehículo</label>
                    <select id="input-tipo">
                        <option value="Carro">Carro</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>
                <button class="btn" onclick="registrarEntrada()">Confirmar Entrada</button>
                <br>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</div>

<script src="parqueo.js"></script>
</body>
</html>
